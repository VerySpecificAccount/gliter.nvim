name: vimdoc

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'doc/gliter.*.md'
      - '.github/workflows/vimdoc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Convert main README.md → doc/gliter.txt
      - name: Convert main README
        uses: kdheepak/panvimdoc@main
        with:
          vimdoc: gliter
          pandoc: README.md          # input file
          description: "Emacs ideas, Neovim-native — an opt-in plugin suite."

      # Convert each module doc: doc/gliter.netrw.md → doc/gliter.netrw.txt
      - name: Convert module docs
        run: |
          for md in doc/gliter.*.md; do
            base=$(basename "$md" .md)   # e.g. gliter.netrw
            nvim --headless -c "lua require('panvimdoc').convert({ input = '$md', output = 'doc/${base}.txt', vimdoc_name = '${base}', project_name = 'gliter' })" -c 'qa!'
          done
        # ^ The action above only runs once per workflow file.  
        #   For per-module conversion, panvimdoc exposes a Lua API.
        #   If the Lua API differs in your version, see the fallback below.

      - name: Generate doc/tags
        run: nvim --headless -c 'helptags doc/' -c 'qa!'

      - name: Commit generated vimdoc
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-generate vimdoc from markdown"
          file_pattern: 'doc/*.txt doc/tags'
          branch: ${{ github.head_ref || github.ref_name }}
